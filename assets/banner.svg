<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #090d16; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .eq-bar {
      transform-origin: bottom;
      animation: bounce 1.8s ease-in-out infinite alternate;
    }
    @keyframes bounce {
      0% { transform: scaleY(0.25); }
      50% { transform: scaleY(0.9); }
      100% { transform: scaleY(0.4); }
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.15; transform: scale(0.9); }
      100% { opacity: 0.45; transform: scale(1.1); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="12" fill="url(#bg-grad)" />

  <!-- Studio Grid Pattern -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="400" y1="0" x2="400" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="800" y1="0" x2="800" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1000" y1="0" x2="1000" y2="360" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Glowing Orbs in background -->
  <circle cx="150" cy="180" r="130" fill="#38bdf8" opacity="0.2" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="180" r="140" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="pulse-circle" style="animation-delay: -1.5s;" />

  <!-- Animated Equalizer Bars in the background (Right side) -->
  <g transform="translate(820, 290)" opacity="0.55">
    <rect class="eq-bar" x="0" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.1s;" />
    <rect class="eq-bar" x="18" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.4s;" />
    <rect class="eq-bar" x="36" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.2s;" />
    <rect class="eq-bar" x="54" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.7s;" />
    <rect class="eq-bar" x="72" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.3s;" />
    <rect class="eq-bar" x="90" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.5s;" />
    <rect class="eq-bar" x="108" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.8s;" />
    <rect class="eq-bar" x="126" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.2s;" />
    <rect class="eq-bar" x="144" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.6s;" />
    <rect class="eq-bar" x="162" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.3s;" />
    <rect class="eq-bar" x="180" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.9s;" />
    <rect class="eq-bar" x="198" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.4s;" />
    <rect class="eq-bar" x="216" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.7s;" />
    <rect class="eq-bar" x="234" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.1s;" />
    <rect class="eq-bar" x="252" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.5s;" />
    <rect class="eq-bar" x="270" y="-140" width="12" height="140" rx="6" fill="url(#bar-grad)" style="animation-delay: 0.3s;" />
  </g>

  <!-- Foreground Content: Header Tag / Badge -->
  <g transform="translate(80, 56)">
    <rect width="285" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#22c55e" />
    <text x="30" y="20" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title & Subtitle (In Foreground, Never Obscured) -->
  <text x="80" y="145" fill="url(#title-grad)" font-size="42" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))">Awesome Audio Synthesis &amp; DAWs</text>
  <text x="80" y="190" fill="#f8fafc" font-size="20" font-weight="500" opacity="0.95">Next-Gen Web Audio, Digital Audio Workstations, Modular Synths &amp; Production Tools</text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(80, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
      <text x="16" y="23" fill="#38bdf8" font-size="13" font-weight="600">🎛️ Digital Audio Workstations</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(182, 0)">
      <rect width="155" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
      <text x="16" y="23" fill="#a855f7" font-size="13" font-weight="600">🎹 Real-Time Synthesis</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(349, 0)">
      <rect width="160" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
      <text x="16" y="23" fill="#ec4899" font-size="13" font-weight="600">🌐 Browser &amp; Web Audio</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(521, 0)">
      <rect width="160" height="36" rx="8" fill="#111827" stroke="#334155" stroke-width="1.2" />
      <text x="16" y="23" fill="#22c55e" font-size="13" font-weight="600">⚡ Free &amp; Open Source</text>
    </g>
  </g>

  <!-- Subtle bottom accent line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#title-grad)" />
</svg>